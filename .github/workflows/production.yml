name: Production Deployment & Docker Build

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the main branch code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Extract Git Commit SHA to use as a unique version tag
    - name: Get Git Commit SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 3. Login to Docker Hub securely using GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Build and Push Docker Image tagged with 'latest' AND the unique Commit SHA
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest
          ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ steps.vars.outputs.sha_short }}